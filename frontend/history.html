<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergency trip history</title><style>:root{--bg:#f3f5f4;--ink:#16211d;--mut:#51605a;--acc:#0b6e4f;--line:#cfd8d3;--panel:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--ink:#e6efeb;--mut:#9db0a8;--acc:#4fc79c;--line:#33403a;--panel:#1b2420}}
body{margin:0;font:16px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{color:var(--acc)}
.b{display:inline-block;padding:10px 18px;border-radius:6px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;margin-right:8px;border:0;font-size:15px;cursor:pointer}.b.o{background:none;color:var(--acc);border:1px solid var(--acc)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}</style></head>
<body><div style="max-width:900px;margin:0 auto;padding:24px"><p><a href="/app">Back to dashboard</a></p><h1>Emergency trip history</h1><p id="m">Loading…</p><div id="t" style="overflow-x:auto"></div>
<script>(async()=>{const T=sessionStorage.getItem("t");if(!T)return location="/app";const r=await fetch("/api/emergency/trips",{headers:{"x-token":T}});
if(!r.ok){m.textContent=r.status==401?"Please sign in first.":"Only ambulance operators and administrators can view trip history.";return}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const d=await r.json();m.textContent=d.length?"Simulated data. Positions are the location updates saved during each trip.":"No trips yet.";
t.innerHTML="<table><tr><th>#</th><th>Ambulance</th><th>Severity</th><th>Status</th><th>Est. min</th><th>km</th><th>Started</th><th>Ended</th><th>Positions</th></tr>"+d.map(x=>`<tr><td>${x.id}</td><td>${esc(x.amb_code)}</td><td>${x.severity}</td><td>${x.status}</td><td>${x.est_minutes}</td><td>${x.km}</td><td>${(x.started_at||"").slice(0,16)}</td><td>${(x.completed_at||"").slice(0,16)}</td><td>${x.positions}</td></tr>`).join("")+"</table>"})()</script></div></body></html>
